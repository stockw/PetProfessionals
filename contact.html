<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="title">
        <h1>Paradigm Pet Professionals</h1>
    </div>
    <nav>
        <ul class="nav">
            <li><a href="index.html">Home</a></li>
            <li><a href="cats.html">Cats</a></li>
            <li><a href="dogs.html">Dogs</a></li>
            <li><a href="fish.html">Fish</a></li>
            <li><a href="contact.html" class="active">Contact Us</a></li>
        </ul>
    </nav>

    <div>
        <h1>Contact a Pet Professional</h1>

        <form action="#" method="post">
            <h2>Pet Owner's Information</h2>
            <label for="name">First and Last Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone">

            <label for="timezone">Time Zone</label>
            <select id="timezone" name="timezone">
                <option value="EST">EST</option>
                <option value="CST">CST</option>
                <option value="MST">MST</option>
                <option value="PST">PST</option>
            </select>
            <h2>Pet Informartion</h2>
            <label for="petname">Pet Name</label>
            <input type="text" id="petname" name="petname">

            <label for="pettype">Pet Type</label>
            <select id="pettype" name="pettype">
                <option value="Cat">Cat</option>
                <option value="Dog">Dog</option>
                <option value="Fish">Fish</option>
                <option value="Other">Other</option>
            </select>
            
            <label for="petage">Pet age</label>
            <input type="number" name="petage" id="petage" min="0">

            <br><br>
            <input type="submit" value="Submit for a Consultation">
        </form>
    </div>
</body>
</html>
