     <nav>

            <form class="nav-search" action="#" method="get">
            <label for="search" class="visually-hidden">Search</label>

    <hr class="double-line">

    <main  id="main-content" class="content">
        <h2>Contact a Pet Professional</h2>

        <div class="form-container">
            <form action="#" method="post">
                <fieldset>
                    <legend>Pet Owner's Information</legend>

                    <label for="name">First and Last Name</label>
                    <input type="text" id="name" name="name" required aria-required="true">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required aria-required="true">

                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" aria-describedby="phone-help">
                    <small id="phone-help">Optional</small>

                    <label for="timezone">Time Zone</label>
                    <select id="timezone" name="timezone">
                        <option value="EST">EST</option>
                        <option value="CST">CST</option>
                        <option value="MST">MST</option>
                        <option value="PST">PST</option>
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Pet Information</legend>

                    <label for="petname">Pet Name</label>
                    <input type="text" id="petname" name="petname">

                    <label for="pettype">Pet Type</label>
                    <select id="pettype" name="pettype">
                        <option value="Cat">Cat</option>
                        <option value="Dog">Dog</option>
                        <option value="Fish">Fish</option>
                        <option value="Other">Other</option>
                    </select>

                    <label for="petage">Pet Age</label>
                    <input type="number" name="petage" id="petage" min="0">
                </fieldset>

                <div class="form-actions">
                    <input type="submit" value="Submit for a Consultation">
                </div>    
            </form>
        </div>
    </main>
